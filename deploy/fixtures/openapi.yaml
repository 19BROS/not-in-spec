# tiny fixture spec for Prism smoke/integration tests (SPEC §9)
openapi: 3.1.0
info: { title: Fixture API, version: 1.0.0 }
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - { name: petId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: A pet
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: integer }
                  name: { type: string }
                example: { id: 1, name: Rex }
