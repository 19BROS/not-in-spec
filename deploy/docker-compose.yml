name: notinspec

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: notinspec
      POSTGRES_USER: notinspec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "notinspec"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/${IMAGE_OWNER:-local}/notinspec-api:${TAG:-latest}
    build: { context: .., dockerfile: api/Dockerfile }
    environment: &app-env
      DATABASE_URL: postgresql://notinspec:${POSTGRES_PASSWORD}@postgres:5432/notinspec
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  worker:
    image: ghcr.io/${IMAGE_OWNER:-local}/notinspec-worker:${TAG:-latest}
    build: { context: .., dockerfile: worker/Dockerfile }
    environment:
      <<: *app-env
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  web:
    image: ghcr.io/${IMAGE_OWNER:-local}/notinspec-web:${TAG:-latest}
    build: { context: ../web }
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # mock server for local dev / integration tests: docker compose --profile prism up
  prism:
    profiles: [prism]
    image: stoplight/prism:5
    # multiprocess mode crashes in the container (cluster.isPrimary undefined)
    command: mock -h 0.0.0.0 --multiprocess=false /spec/openapi.yaml
    volumes:
      - ${PRISM_SPEC:-./fixtures/openapi.yaml}:/spec/openapi.yaml:ro
    ports:
      - "4010:4010"

volumes:
  pgdata:
