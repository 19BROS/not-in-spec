name: notinspec

x-app-env: &app-env
  # not the owner: notinspec_app cannot change the schema or UPDATE/DELETE append-only rows (SPEC §10)
  DATABASE_URL: postgresql://notinspec_app:${NOTINSPEC_APP_PASSWORD:?set NOTINSPEC_APP_PASSWORD in deploy/.env}@postgres:5432/notinspec
  # Enable only after migrations and project registration (docs/hosted-ci.md).
  NOTINSPEC_UPLOADS_ENABLED: ${NOTINSPEC_UPLOADS_ENABLED:-0}
  NOTINSPEC_UPLOADS_DIR: /uploads
  NOTINSPEC_RUNS_DIR: /runs
  NOTINSPEC_PUBLIC_URL: ${NOTINSPEC_PUBLIC_URL:-https://147-175-151-17.sslip.io}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: notinspec
      POSTGRES_USER: notinspec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "notinspec"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # one-shot before api and worker, on every `up` (docs/DEPLOY.md): creates the login role
  # notinspec_app or resets its password from .env, then `notinspec db upgrade` as the owner,
  # which migrates and grants the role its privileges. Both steps are idempotent.
  migrate:
    image: ghcr.io/${IMAGE_OWNER:-local}/notinspec-api:${TAG:-latest}
    build: { context: .., dockerfile: api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://notinspec:${POSTGRES_PASSWORD}@postgres:5432/notinspec
      NOTINSPEC_APP_PASSWORD: ${NOTINSPEC_APP_PASSWORD:?set NOTINSPEC_APP_PASSWORD in deploy/.env}
    entrypoint: ["sh", "-c"]
    command:
      - |
        python - <<'EOF'
        import os, psycopg
        from psycopg import sql
        with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
            if conn.execute("SELECT 1 FROM pg_roles WHERE rolname = 'notinspec_app'").fetchone() is None:
                conn.execute("CREATE ROLE notinspec_app LOGIN")
            password = sql.Literal(os.environ["NOTINSPEC_APP_PASSWORD"])
            conn.execute(sql.SQL("ALTER ROLE notinspec_app LOGIN PASSWORD {}").format(password))
        print("role notinspec_app is ready")
        EOF
        exec notinspec db upgrade
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: ghcr.io/${IMAGE_OWNER:-local}/notinspec-api:${TAG:-latest}
    build: { context: .., dockerfile: api/Dockerfile }
    environment:
      <<: *app-env
      # results.json pushed by the GitHub Action (POST /api/runs); empty = ingest disabled
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      RESULTS_DIR: /results
      # shortcut: demo runs (`notinspec demo`) are folders on a volume, not in Postgres (SPEC §18)
    volumes:
      - results:/results
      - demo-runs:/runs:ro
      - uploads:/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    image: ghcr.io/${IMAGE_OWNER:-local}/notinspec-worker:${TAG:-latest}
    build: { context: .., dockerfile: worker/Dockerfile }
    environment:
      <<: *app-env
      NOTINSPEC_HOSTED_CLAIMS: ${NOTINSPEC_HOSTED_CLAIMS:-0}
      FIIT_API_KEY: ${FIIT_API_KEY:-} # claim extractors, read by notinspec.runner (SPEC §8)
      GROQ_API_KEY: ${GROQ_API_KEY:-} # models under test, read by notinspec.runner (SPEC §8)
      NOTINSPEC_MOCK_URL: http://mock:4011 # POST /serve {"spec": "<sha256>.yaml"}, deploy/mock
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      OMP_NUM_THREADS: "3" # torch ignores the cpus limit and would start 4 threads
    # NLI peaks at ~3.1 GB on all cores (SPEC §6.4); 1 vCPU stays for postgres, api, proxy
    mem_limit: 6g
    cpus: 3
    volumes:
      # NLI model weights (HF_HOME); the image runs with HF_HUB_OFFLINE=1, the deploy fetches once
      - hf-models:/models
      # written by `notinspec demo --runs-dir /runs` run in this container (docs/DEPLOY.md)
      - demo-runs:/runs
      - uploads:/uploads
      # uploaded OpenAPI specs as <sha256>.yaml for the mock service
      - specs:/specs
    networks: [default, sandbox]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    image: ghcr.io/${IMAGE_OWNER:-local}/notinspec-web:${TAG:-latest}
    build: { context: ../web }
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # the only service with published ports; see deploy/Caddyfile
  proxy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # keep certs across deploys, or every deploy re-issues and hits Let's Encrypt rate limits
      - caddy-data:/data
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    # the image has none, so `up --wait` would accept a Caddy that crash-loops on a bad config;
    # 127.0.0.1, not localhost: busybox resolves localhost to ::1, the admin API listens on IPv4
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 5s
      retries: 10
    depends_on: [web]
    restart: unless-stopped

  # daily pg_dump on the VM (SPEC §6), started only by the deploy workflow; see docs/DEPLOY.md
  backup:
    profiles: [backup]
    image: postgres:17
    environment:
      PGHOST: postgres
      PGUSER: notinspec
      PGDATABASE: notinspec
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-/data/backups}:/backups
    entrypoint: ["sh", "-c"]
    # shortcut: dumps stay on the VM's data disk, off-machine copy is a manual pull (docs/DEPLOY.md)
    command:
      - |
        while true; do
          f=/backups/notinspec-$$(date -u +%Y%m%dT%H%MZ).dump
          # prune old dumps only after a good one, so failing backups never delete the last good dump
          if pg_dump -Fc -f "$$f.tmp"; then
            mv "$$f.tmp" "$$f" && echo "backup ok: $$f"
            find /backups -name 'notinspec-*.dump' -mtime +14 -delete
          else
            rm -f "$$f.tmp"; echo "BACKUP FAILED"
          fi
          sleep 86400
        done
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # Prism on an uploaded, untrusted spec (SPEC §12): no secrets, no internet (sandbox is
  # internal), spec read-only. The worker picks the spec through deploy/mock/control.js.
  mock:
    image: stoplight/prism:5.15.10 # exact: control.js runs the CLI by its path in the image
    entrypoint: ["/sbin/tini", "--", "node", "/control.js"]
    user: node
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # a hostile spec (deep recursive schemas) must not take the VM's memory from the worker
    mem_limit: 512m
    volumes:
      - ./mock/control.js:/control.js:ro
      - specs:/specs:ro
    networks: [sandbox]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4011/health"]
      interval: 5s
      retries: 10
    restart: unless-stopped

networks:
  sandbox:
    internal: true # no route out: Prism never fetches anything a spec points to

volumes:
  pgdata:
  results:
  caddy-data:
  hf-models:
  demo-runs:
  specs:
  uploads:
