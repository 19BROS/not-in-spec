# Rate limit on the token-checked POSTs (SPEC §11.1: 429 = our limit, the Action reports "no result").
# Keyed by client IP; an empty key (every other path) is not limited.
map $uri $upload_client {
    ~^/api/(uploads|pr-closed)$ $binary_remote_addr;
    default "";
}
limit_req_zone $upload_client zone=uploads:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;

    # the client's IP from Caddy (proxy), or every client shares one limit. Only proxy reaches
    # this port (nothing else is published), so the Docker networks' private ranges are trusted.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # /api/health -> api:8000/health
    location /api/ {
        client_max_body_size 26m;  # 25 MiB archive plus multipart envelope; core caps actual bytes
        # checked before the body is read; a burst covers a job's retries and parallel matrix jobs
        limit_req zone=uploads burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
