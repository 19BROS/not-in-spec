# Reusable GitHub Action (SPEC §11): a thin client of our service. Computes nothing, holds no key.
name: NOT-IN-SPEC
description: Uploads your documentation to NOT-IN-SPEC and reports how well LLMs can use it.
inputs:
  config:
    description: Path to notinspec.yaml in the caller repo
    default: notinspec.yaml
  server-url:
    description: NOT-IN-SPEC service (https)
    default: https://147-175-151-17.sslip.io
  timeout-minutes:
    description: How long to wait for the run; then the job passes with a warning
    default: "60"
  github-token:
    description: Token for the PR comment; needs pull-requests write
    default: ${{ github.token }}
outputs:
  verdict:
    description: pass, fail, or empty when there is no result
    value: ${{ steps.run.outputs.verdict }}
  run-url:
    description: The run in the web UI
    value: ${{ steps.run.outputs.run-url }}
runs:
  using: composite
  steps:
    # a fork PR gets no OIDC token; a merged PR needs no closed event (the main run follows)
    - id: skip
      shell: bash
      env:
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        MERGED: ${{ github.event.pull_request.merged }}
        EVENT_ACTION: ${{ github.event.action }}
      run: |
        if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
          echo "::warning::NOT-IN-SPEC skipped: pull request from a fork"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        elif [ "$EVENT_ACTION" = closed ] && [ "$MERGED" = true ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.skip.outputs.skip != 'true' && github.event.action != 'closed'
      uses: astral-sh/setup-uv@v7
      # the cache would key on the caller's files (none match: "No file matched" warning) and
      # write to the caller's Actions cache; `pack` installs only core's few deps anyway
      with: { enable-cache: false }

    - id: run
      if: steps.skip.outputs.skip != 'true'
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        SERVER_URL: ${{ inputs.server-url }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_ACTION: ${{ github.event.action }}
      run: bash "$GITHUB_ACTION_PATH/client.sh"

    - if: steps.run.outputs.comment != ''
      uses: actions/upload-artifact@v7
      with:
        name: notinspec-results
        path: ${{ runner.temp }}/notinspec/
        if-no-files-found: ignore

    # one comment per PR, updated on every push instead of adding a new one
    - if: steps.run.outputs.comment != '' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        COMMENT: ${{ steps.run.outputs.comment }}
      run: |
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- notinspec -->")) | .id' | head -n1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$COMMENT" > /dev/null
        else
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$COMMENT" > /dev/null
        fi

    # the job's result is the PR's status check
    - if: steps.run.outputs.code != '' && steps.run.outputs.code != '0'
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.code }}
      run: exit "$CODE"
