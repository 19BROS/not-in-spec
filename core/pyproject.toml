[project]
name = "notinspec"
version = "0.0.0"
description = "Measures how reliably LLMs answer questions about an API, over time."
requires-python = ">=3.12"
dependencies = [
    "openapi-spec-validator>=0.9.0",
    "orjson>=3.13.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
notinspec = "notinspec.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
