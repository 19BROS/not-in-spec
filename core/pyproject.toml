[project]
name = "notinspec"
version = "0.0.0"
description = "Measures how well LLMs can use software based on its documentation."
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx2>=2.13.1",
    "markdown-it-py>=4.2.0",
    "openapi-spec-validator>=0.9.0",
    "orjson>=3.13.0",
    "packaging>=25.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# local NLI cross-encoder (SPEC §6.4), CPU only; the worker installs it, CI and the API do not
nli = ["torch>=2.4", "transformers>=4.56"]
# Postgres models and migrations (notinspec.db, SPEC §18): the API and the worker install it;
# the CLI works without it
db = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[project.scripts]
notinspec = "notinspec.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

# CPU wheels only (no CUDA); the index itself is declared in the root pyproject
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
