# Uses the project's own tool versions via uv (no separate pins to keep in sync).
# Install once: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (core)
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^core/
