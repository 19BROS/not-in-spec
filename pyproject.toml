[project]
name = "notinspec-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "api", "worker"]

# torch for notinspec[nli]; explicit, so only packages pinned to it come from here
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "alembic>=1.14",  # alembic, psycopg, sqlalchemy: notinspec[db] for mypy and the DB tests
    "httpx2",  # FastAPI TestClient
    "mypy>=1.13",
    "pre-commit>=4",
    "psycopg[binary]>=3.2",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "sqlalchemy>=2.0",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["notinspec", "notinspec_api", "notinspec_worker"]

[tool.mypy]
strict = true
files = ["core/src"]

# notinspec[nli] is optional and not installed in CI: treat it as untyped everywhere, so mypy
# gives the same result with and without the extra
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "huggingface_hub", "huggingface_hub.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["core/tests", "api/tests", "worker/tests"]
addopts = "--import-mode=importlib"
markers = ["slow: needs a real NLI model or Prism; skip with -m 'not slow'"]

[tool.coverage.report]
# coverage gate on core only (SPEC §9); the --cov target in CI decides what is measured
fail_under = 80
