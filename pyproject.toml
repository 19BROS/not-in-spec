[project]
name = "notinspec-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "api", "worker"]

[dependency-groups]
dev = [
    "httpx2",  # FastAPI TestClient
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["notinspec", "notinspec_api", "notinspec_worker"]

[tool.mypy]
strict = true
files = ["core/src"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "api/tests", "worker/tests"]
addopts = "--import-mode=importlib"

[tool.coverage.report]
# coverage gate on core only (SPEC §9); the --cov target in CI decides what is measured
fail_under = 80
