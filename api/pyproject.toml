[project]
name = "notinspec-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "notinspec",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
notinspec = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "notinspec_api"
