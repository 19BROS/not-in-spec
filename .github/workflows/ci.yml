name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with: { python-version: "3.12" }
      - run: uv sync --locked --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # coverage gate on core only (SPEC §9); CI never calls OpenRouter
      - run: uv run pytest --cov=notinspec --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    needs: [python, web]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/docker-compose.yml --profile prism up -d --build --wait
      - run: curl -fsS localhost:8080/api/health
      - run: curl -fsS localhost:4010/pets/1
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile prism logs
      - if: always()
        run: docker compose -f deploy/docker-compose.yml --profile prism down -v

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: ., file: api/Dockerfile }
          - { name: worker, context: ., file: worker/Dockerfile }
          - { name: web, context: web, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/notinspec-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/notinspec-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
