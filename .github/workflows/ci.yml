name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: notinspec_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/notinspec_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tags upstream
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # coverage gate on core only (SPEC §9); CI never calls OpenRouter
      - run: uv run pytest --cov=notinspec --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    needs: [python, web]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
      INGEST_TOKEN: ci
      BACKUP_DIR: /tmp/notinspec-backups # runner context isn't allowed in job-level env
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/docker-compose.yml --profile backup up -d --build --wait
      - run: curl -fsS localhost:8080/api/health
      - run: sh deploy/mock/smoke.sh
      # what the Action pushes reaches the api through nginx and lands on the results volume
      - run: >-
          curl -fsS -X POST localhost:8080/api/runs -H "Authorization: Bearer ci"
          --data-binary @action/example-results.json
      # the backup service dumps on start; prove the dump exists and Postgres can read it
      - run: timeout 60 sh -c 'until ls "$BACKUP_DIR"/*.dump; do sleep 2; done'
      - run: docker run --rm -v "$BACKUP_DIR":/b postgres:17 sh -c 'pg_restore -l /b/*.dump > /dev/null'
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile backup logs
      - if: always()
        run: docker compose -f deploy/docker-compose.yml --profile backup down -v

  # the Action as a caller repo uses it, against the upload API stub (SPEC §11.1)
  action:
    # fork PRs: the Action skips itself (no OIDC token), so there is no verdict to check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the Action's OIDC token (the stub does not check it)
      pull-requests: write # the Action's PR comment
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 } # the merge commit's first parent
      - run: mkdir -p "$RUNNER_TEMP/archives" && (python3 action/stub.py 8765 "$RUNNER_TEMP/archives" &)
      - id: notinspec
        uses: ./action
        with: { config: deploy/fixtures/notinspec.yaml, server-url: "http://127.0.0.1:8765" }
      - run: test "${{ steps.notinspec.outputs.verdict }}" = pass
      # the archive has exactly the inputs core selects, and the config under its fixed name
      - run: test "$(tar tzf "$RUNNER_TEMP"/archives/stub-1.tar.gz | xargs)" = "docs/index.md docs/pets.md notinspec.yaml openapi.yaml"
      # the client alone: a fail verdict exits 1, bad inputs or config exit 2 (never 1), our crash passes
      - run: |
          for m in fail input-error internal-error; do
            cp -r deploy/fixtures "$RUNNER_TEMP/$m" && echo "<!-- notinspec-mock: $m -->" >> "$RUNNER_TEMP/$m/docs/pets.md"
          done
          echo 'docs: {paths: "docs/*.md"}' > "$RUNNER_TEMP/fail/broken.yaml"
          client() {
            local out; out=$(mktemp)
            GITHUB_OUTPUT=$out GITHUB_ACTION_PATH=$PWD/action CONFIG=$1 SERVER_URL=http://127.0.0.1:8765 \
              TIMEOUT_MINUTES=1 HEAD_SHA= EVENT_ACTION= GITHUB_STEP_SUMMARY=/dev/null bash action/client.sh > /dev/null
            grep '^code=' "$out"
          }
          test "$(client "$RUNNER_TEMP/fail/notinspec.yaml")" = code=1
          test "$(client "$RUNNER_TEMP/input-error/notinspec.yaml")" = code=2
          test "$(client "$RUNNER_TEMP/internal-error/notinspec.yaml")" = code=0
          test "$(client "$RUNNER_TEMP/fail/broken.yaml")" = code=2

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [compose, action]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: ., file: api/Dockerfile }
          - { name: worker, context: ., file: worker/Dockerfile }
          - { name: web, context: web, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/notinspec-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/notinspec-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
