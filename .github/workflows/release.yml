name: Release

# Tag vX.Y.Z on main → the git tag vX moves to this commit, so callers on `@vX` get the release.
# The Action has no image of its own: it runs `notinspec pack` from core/ at the same ref.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # move the major tag

jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # tags pushed with GITHUB_TOKEN don't start workflows, and vX doesn't match v*.*.* anyway
      - run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" && git push -f origin "refs/tags/$major"
