name: Release

# Tag vX.Y.Z on main → image notinspec-cli:X.Y.Z, and the git tag vX moves to this commit.
# action.yml pins the image to X.Y.Z (bump it in the release PR), so `@vX.Y.Z` and `@vX` both
# run the image of their own release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # move the major tag
  packages: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}"
            echo "VERSION=$v"
            echo "MAJOR=v${v%%.*}"
          } >> "$GITHUB_ENV"
      # fail before publishing anything if the release PR forgot to bump the pinned image
      - run: |
          grep -q "default: ghcr.io/19bros/notinspec-cli:$VERSION$" action/action.yml || {
            echo "::error::action/action.yml must default to notinspec-cli:$VERSION"; exit 1; }
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: action
          file: action/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/notinspec-cli:${{ env.VERSION }}
      # tags pushed with GITHUB_TOKEN don't start workflows, and vX doesn't match v*.*.* anyway
      - run: git tag -f "$MAJOR" && git push -f origin "refs/tags/$MAJOR"
