[project]
name = "notinspec-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "notinspec",
    "apscheduler>=3.10,<4",
]

[project.scripts]
notinspec-worker = "notinspec_worker.main:main"

[tool.uv.sources]
notinspec = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "notinspec_worker"
